<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Zingpass</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/toast.js" defer></script>
  <script src="/assets/js/forgot.js" defer></script>
</head>
<body>
  <div class="wrapper">
    <h1>Forgot password</h1>
    <form id="forgot-form" novalidate>
      <div>
        <label for="email-input"><span>@</span></label>
        <input type="email" name="email" id="email-input" placeholder="Email" autocomplete="email" required>
      </div>
      <button type="submit" id="forgot-btn">Send reset link</button>
    </form>
    <p style="margin-top: 24px;">Remembered it? <a href="/login">Sign in</a></p>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
