server {
    listen 80;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;

    # Reverse proxy to the Go API.
    location /auth/ {
        proxy_pass http://zingpass:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets (css, js, img).
    location /assets/ {
        try_files $uri =404;
    }

    # Pretty page URLs.
    location = / {
        return 302 /login;
    }
    location = /login {
        try_files /pages/login.html =404;
    }
    location = /signup {
        try_files /pages/signup.html =404;
    }
    location = /dashboard {
        try_files /pages/dashboard.html =404;
    }
    location = /verify {
        try_files /pages/verify.html =404;
    }
    location = /forgot {
        try_files /pages/forgot.html =404;
    }
    location = /reset-password {
        try_files /pages/reset.html =404;
    }

    # Trailing-slash and legacy aliases — always send users to the canonical URL.
    location = /login/      { return 301 /login; }
    location = /signup/     { return 301 /signup; }
    location = /verify/     { return 301 /verify; }
    location = /dashboard/  { return 301 /dashboard; }
    location ~ ^/register/?$ { return 301 /signup; }
}
