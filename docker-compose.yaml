services:
  storage:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zingpass
      POSTGRES_USER: zingpass
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zingpass -d zingpass"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  cache:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  zingpass:
    build: .
    restart: on-failure
    environment:
      STORAGE_DB_HOST: storage
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      REDIS_ADDR: cache:6379
      ENV: ${ENV:-dev}
    ports:
      - "8080:8080"
    depends_on:
      storage:
        condition: service_healthy
      cache:
        condition: service_healthy

  zingweb:
    image: nginx:1.27-alpine
    restart: on-failure
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - zingpass

volumes:
  redis_data:
